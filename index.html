<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Four Lane Rush 3D</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 background:#87ceeb;
 font-family:Arial;color:white;
 touch-action:none
}
#hud{
 position:absolute;top:15px;left:15px;
 z-index:5;font-size:20px;font-weight:bold;
 text-shadow:2px 2px 4px black
}
#menu{
 position:absolute;inset:0;background:#0009;
 z-index:10;display:flex;
 align-items:center;justify-content:center;
 text-align:center
}
#panel{
 background:#182b40;padding:25px;
 border-radius:18px;width:85%;max-width:350px
}
button{
 border:0;border-radius:12px;padding:15px 25px;
 background:#ffb000;font-size:20px;font-weight:bold;
 touch-action:manipulation
}
#controls{
 position:absolute;bottom:25px;left:0;right:0;
 display:flex;justify-content:space-between;
 padding:0 25px;z-index:5
}
#controls button{
 width:85px;height:65px;font-size:30px;
 background:#ffffffbb
}
</style>
</head>
<body>

<div id="hud">
 SKOR: <span id="score">0</span><br>
 KECEPATAN: <span id="speedText">30</span>
</div>

<div id="menu">
 <div id="panel">
  <h1>FOUR LANE RUSH</h1>
  <p>Hindari lalu lintas dan pecahkan skor tertinggi!</p>
  <button id="startBtn">MULAI</button>
 </div>
</div>

<div id="controls">
 <button id="left">◀</button>
 <button id="right">▶</button>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,90,260);

scene.add(new THREE.AmbientLight(0xffffff,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,30,15);
scene.add(sun);

// CAMERA
const camera=new THREE.PerspectiveCamera(
 85,innerWidth/innerHeight,.1,350
);
camera.position.set(0,5,18);
camera.lookAt(0,.8,-18);

// RENDERER
const renderer=new THREE.WebGLRenderer({
 antialias:false
});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

// MATERIAL
function mat(color){
 return new THREE.MeshLambertMaterial({color});
}

function box(w,h,d,color,x,y,z,parent=scene){
 const m=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat(color)
 );
 m.position.set(x,y,z);
 parent.add(m);
 return m;
}

// ROAD
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(13,350),
 mat(0x383838)
);
road.rotation.x=-Math.PI/2;
road.position.z=-130;
scene.add(road);

// GRASS
const grass=new THREE.Mesh(
 new THREE.PlaneGeometry(250,350),
 mat(0x399b40)
);
grass.rotation.x=-Math.PI/2;
grass.position.set(0,-.1,-130);
scene.add(grass);

// ROAD LINES
let lines=[];
for(let x of [-3,0,3]){
 for(let z=-280;z<20;z+=12){
  lines.push(box(.1,.04,5,0xffffff,x,.04,z));
 }
}

for(let x of [-6.5,6.5]){
 box(.2,.1,350,0xffffff,x,.04,-130);
}

// TREES
let trees=[];
function makeTree(x,z){
 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.2,.3,1.5,7),
  mat(0x754321)
 );
 trunk.position.y=.75;
 g.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.3,3.5,8),
  mat(0x14732c)
 );
 leaves.position.y=3;
 g.add(leaves);

 g.position.set(x,0,z);
 scene.add(g);
 trees.push(g);
}

for(let z=-280;z<20;z+=15){
 makeTree(-10,z);
 makeTree(10,z-7);
}

// CAR
function makeCar(color){
 const g=new THREE.Group();

 box(1.55,.65,3,color,0,.7,0,g);
 box(1.25,.7,1.5,0x263f55,0,1.25,-.1,g);

 box(1.1,.35,.08,0x8ed8ff,0,1.35,-.88,g);
 box(1.1,.35,.08,0x8ed8ff,0,1.35,.68,g);

 for(let x of [-.82,.82]){
  for(let z of [-.95,.95]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.32,.32,.2,12),
    mat(0x111111)
   );
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.38,z);
   g.add(wheel);
  }
 }

 for(let x of [-.48,.48]){
  box(.3,.2,.08,0xffffbb,x,.72,-1.53,g);
  box(.3,.2,.08,0xff2222,x,.72,1.53,g);
 }

 return g;
}

// PLAYER
const player=makeCar(0x1565ff);
player.position.set(-1.5,0,5);
scene.add(player);

const lanes=[-4.5,-1.5,1.5,4.5];

let traffic=[];
let running=false;
let score=0;
let speed=30;
let targetX=-1.5;
let spawnTimer=0;
let lastTime=0;
let waveTimer=0;

// CONTROLS
function moveLeft(){
 if(!running)return;
 let i=lanes.indexOf(targetX);
 targetX=lanes[Math.max(0,i-1)];
}

function moveRight(){
 if(!running)return;
 let i=lanes.indexOf(targetX);
 targetX=lanes[Math.min(3,i+1)];
}

document.getElementById("left")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 moveLeft();
});

document.getElementById("right")
.addEventListener("pointerdown",e=>{
 e.preventDefault();
 moveRight();
});

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")moveLeft();
 if(e.key==="ArrowRight")moveRight();
});

// SPAWN CAR
function spawnCar(lane,opposite){
 // Jangan munculkan mobil terlalu dekat dengan mobil lain
 const occupied=traffic.some(c=>
  c.lane===lane &&
  c.mesh.position.z < -35
 );

 if(occupied)return;

 const colors=[
  0xff2222,0xffcc00,0xffffff,
  0x222222,0x00cc99,0xff7700
 ];

 const car=makeCar(
  colors[Math.floor(Math.random()*colors.length)]
 );

 if(opposite)car.rotation.y=Math.PI;

 car.position.set(lanes[lane],0,-135);
 scene.add(car);

 traffic.push({
  mesh:car,
  opposite:opposite,
  lane:lane
 });
}

// RANDOM TRAFFIC WAVE
function spawnWave(){
 const opponentChance=Math.min(
  .95,.45+score/350
 );

 // Semakin tinggi skor, semakin banyak mobil lawan arah
 const amount=Math.min(
  4,1+Math.floor(score/100)
 );

 let used=[];

 for(let i=0;i<amount;i++){
  let lane=Math.floor(Math.random()*4);

  if(used.includes(lane))continue;
  used.push(lane);

  const opposite=Math.random()<opponentChance;

  spawnCar(lane,opposite);
 }
}

// CLEAR
function clearTraffic(){
 traffic.forEach(c=>scene.remove(c.mesh));
 traffic=[];
}

// START
function startGame(){
 clearTraffic();

 score=0;
 speed=30;
 spawnTimer=0;
 waveTimer=0;
 targetX=-1.5;

 player.position.set(-1.5,0,5);

 running=true;

 document.getElementById("score").textContent="0";
 document.getElementById("speedText").textContent="30";
 document.getElementById("menu").style.display="none";
}

// GAME OVER
function endGame(){
 if(!running)return;

 running=false;

 document.getElementById("menu").style.display="flex";

 document.getElementById("panel").innerHTML=`
 <h1>GAME OVER</h1>
 <h2>SKOR: ${Math.floor(score)}</h2>
 <p>Kecepatan akhir: ${Math.floor(speed)}</p>
 <button id="restartBtn">MAIN LAGI</button>
 `;

 document.getElementById("restartBtn")
 .addEventListener("click",startGame);
}

document.getElementById("startBtn")
.addEventListener("click",startGame);

// GAME LOOP
function animate(time){
 requestAnimationFrame(animate);

 const dt=Math.min((time-lastTime)/1000,.04);
 lastTime=time;

 if(running){

  score+=dt*10;

  // KECEPATAN BERTAMBAH SESUAI SKOR
  speed=Math.min(110,30+score*.16);

  document.getElementById("score").textContent=
   Math.floor(score);

  document.getElementById("speedText").textContent=
   Math.floor(speed);

  // PLAYER
  player.position.x+=
   (targetX-player.position.x)*Math.min(1,dt*10);

  // MARKA JALAN
  lines.forEach(line=>{
   line.position.z+=speed*dt;
   if(line.position.z>15)line.position.z-=294;
  });

  // POHON
  trees.forEach(tree=>{
   tree.position.z+=speed*dt;
   if(tree.position.z>20)tree.position.z-=300;
  });

  // KEPADATAN MOBIL MENINGKAT
  const interval=Math.max(
   .22,1.0-score/350
  );

  spawnTimer+=dt;

  if(spawnTimer>=interval){
   spawnWave();
   spawnTimer=0;
  }

  // GELOMBANG TAMBAHAN
  waveTimer+=dt;

  const extraInterval=Math.max(
   1.4,5-score/100
  );

  if(waveTimer>=extraInterval){
   spawnWave();
   waveTimer=0;
  }

  // TRAFFIC MOVEMENT
  for(let i=traffic.length-1;i>=0;i--){
   const c=traffic[i];

   // Kecepatan mobil lawan arah juga meningkat
   const carSpeed=c.opposite
    ?speed+Math.min(55,20+score*.04)
    :Math.max(12,speed*.65);

   c.mesh.position.z+=carSpeed*dt;

   // COLLISION
   if(
    Math.abs(c.mesh.position.z-player.position.z)<2.2 &&
    Math.abs(c.mesh.position.x-player.position.x)<1.25
   ){
    endGame();
    break;
   }

   if(c.mesh.position.z>18){
    scene.remove(c.mesh);
    traffic.splice(i,1);
   }
  }

  // CAMERA
  camera.position.x+=
   (player.position.x*.08-camera.position.x)*dt*2;

  camera.lookAt(player.position.x*.08,.8,-18);
 }

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
